name: Founder AI Operating Protocol

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-founder-ai-operating-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/verify-founder-ai-operating-protocol.mjs
