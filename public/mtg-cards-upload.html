<!doctype html>
<!-- SYNOPSIS: Batch MTG card upload UI -- founder-facing page for routes/mtg-cards-routes.js. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>MTG Card Batch Upload</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; background: #0f1115; color: #e6e6e6; }
  h1 { font-size: 1.4rem; }
  .drop { border: 2px dashed #444; border-radius: 12px; padding: 2.5rem; text-align: center; cursor: pointer; margin: 1rem 0; }
  .drop.drag { border-color: #6ea8fe; background: #151a24; }
  .drop input { display: none; }
  button { background: #6ea8fe; color: #0f1115; border: none; border-radius: 8px; padding: 0.6rem 1.2rem; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { margin: 1rem 0; color: #9fb3c8; }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.85rem; }
  th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #262b36; }
  th { color: #9fb3c8; font-weight: 600; }
  .tier-high { color: #4ade80; }
  .tier-mid { color: #facc15; }
  .tier-low { color: #94a3b8; }
  .tier-unknown, .err { color: #f87171; }
  .summary { display: flex; gap: 1.5rem; margin: 1rem 0; flex-wrap: wrap; }
  .summary div { background: #151a24; border-radius: 8px; padding: 0.6rem 1rem; }
</style>
</head>
<body>
  <h1>MTG Card Batch Upload</h1>
  <p>Select any number of card photos — larger selections are uploaded in groups of 150 automatically. Each is identified (vision AI), priced (Scryfall), and routed to a sell tier.</p>

  <div class="drop" id="drop">
    <div id="dropLabel">Click to choose photos, or drag them here</div>
    <input type="file" id="fileInput" accept="image/*" multiple>
  </div>

  <button id="uploadBtn" disabled>Upload batch</button>
  <div id="received" style="display:none; font-weight:600; color:#1a7a3a; margin:8px 0;"></div>
  <div id="status"></div>
  <div class="summary" id="summary"></div>
  <table id="results" style="display:none">
    <thead><tr><th>Photo</th><th>Card</th><th>Set</th><th>Foil</th><th>Price</th><th>Tier</th><th>Venue</th><th>Status</th></tr></thead>
    <tbody id="resultsBody"></tbody>
  </table>

<script>
  const drop = document.getElementById('drop');
  const dropLabel = document.getElementById('dropLabel');
  const fileInput = document.getElementById('fileInput');
  const uploadBtn = document.getElementById('uploadBtn');
  const statusEl = document.getElementById('status');
  const receivedEl = document.getElementById('received');
  const summaryEl = document.getElementById('summary');
  const resultsTable = document.getElementById('results');
  const resultsBody = document.getElementById('resultsBody');
  let chosenFiles = [];
  let pollTimer = null;
  // Real bug found live (2026-08-10): the server hard-caps each batch at
  // 150 files (routes/mtg-cards-routes.js MAX_FILES), but this page sent
  // every selected file in one request regardless of count -- a 495-photo
  // selection would be rejected outright before any processing started.
  // Caught while actually watching a real 495-photo upload in progress.
  const CHUNK_SIZE = 150;
  let activeBatches = []; // [{ batchId, total, done, rows }]

  function authHeaders() {
    const token = localStorage.getItem('lifeos_access_token') || '';
    return { 'Authorization': `Bearer ${token}` };
  }

  function setFiles(files) {
    chosenFiles = Array.from(files || []).filter((f) => f.type.startsWith('image/'));
    dropLabel.textContent = chosenFiles.length
      ? `${chosenFiles.length} photo(s) selected`
      : 'Click to choose photos, or drag them here';
    uploadBtn.disabled = chosenFiles.length === 0;
  }

  drop.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => setFiles(e.target.files));
  ['dragenter', 'dragover'].forEach((evt) =>
    drop.addEventListener(evt, (e) => { e.preventDefault(); drop.classList.add('drag'); }));
  ['dragleave', 'drop'].forEach((evt) =>
    drop.addEventListener(evt, (e) => { e.preventDefault(); drop.classList.remove('drag'); }));
  drop.addEventListener('drop', (e) => setFiles(e.dataTransfer.files));

  function chunk(arr, size) {
    const out = [];
    for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
    return out;
  }

  uploadBtn.addEventListener('click', async () => {
    if (!chosenFiles.length) return;
    uploadBtn.disabled = true;
    activeBatches = [];
    resultsTable.style.display = '';

    const chunks = chunk(chosenFiles, CHUNK_SIZE);
    for (let i = 0; i < chunks.length; i++) {
      statusEl.textContent = chunks.length > 1
        ? `Uploading group ${i + 1}/${chunks.length} (${chunks[i].length} photo(s))...`
        : `Uploading ${chunks[i].length} photo(s))...`;

      const form = new FormData();
      chunks[i].forEach((f) => form.append('cards', f));

      try {
        const res = await fetch('/api/v1/mtg-cards/batch-upload', {
          method: 'POST',
          headers: authHeaders(),
          body: form,
        });
        const json = await res.json();
        if (!json.ok) {
          statusEl.textContent = `Group ${i + 1}/${chunks.length} failed: ${json.error || 'unknown error'} — ${activeBatches.length} earlier group(s) still processing.`;
          continue; // don't let one bad group abandon the rest
        }
        activeBatches.push({ batchId: json.batch_id, total: json.file_count, done: 0, rows: [] });
        // Real, immediate confirmation the server actually received these
        // files -- founder, direct: "we can have a show that it received
        // the hundred and ten. That way I know I can go onto the next."
        // Separate from the live done/total polling below (which updates
        // every 2s as identification completes) -- this fires the instant
        // the upload itself succeeds, before any AI/pricing work has run.
        const receivedSoFar = activeBatches.reduce((s, b) => s + b.total, 0);
        receivedEl.textContent = `Received ${receivedSoFar} photo(s) so far.`;
        receivedEl.style.display = '';
      } catch (err) {
        statusEl.textContent = `Group ${i + 1}/${chunks.length} failed: ${err.message} — ${activeBatches.length} earlier group(s) still processing.`;
      }
    }

    if (!activeBatches.length) {
      statusEl.textContent = 'All groups failed to start. Nothing is processing.';
      uploadBtn.disabled = false;
      return;
    }
    const totalReceived = activeBatches.reduce((s, b) => s + b.total, 0);
    receivedEl.textContent = `Received all ${totalReceived} photo(s) — safe to start your next batch of cards. Now identifying each one below.`;
    pollAllBatches();
  });

  function tierClass(tier) {
    return { high: 'tier-high', mid: 'tier-mid', low: 'tier-low' }[tier] || 'tier-unknown';
  }

  function renderRows(rows) {
    resultsBody.innerHTML = rows.map((r) => `
      <tr>
        <td>${r.photo_name || ''}</td>
        <td>${r.identified_name || (r.identify_error ? `<span class="err">${r.identify_error}</span>` : '…')}</td>
        <td>${r.identified_set || ''}</td>
        <td>${r.is_foil === true ? 'Foil' : r.is_foil === false ? '' : ''}</td>
        <td>${r.price_used != null ? '$' + Number(r.price_used).toFixed(2) : ''}</td>
        <td class="${tierClass(r.value_tier)}">${r.value_tier}</td>
        <td>${r.recommended_venue || ''}</td>
        <td>${r.status}</td>
      </tr>
    `).join('');
  }

  function renderSummary(byTier, totalUsd) {
    const tiers = ['high', 'mid', 'low', 'unknown'];
    summaryEl.innerHTML = tiers.map((t) => {
      const d = byTier[t] || { count: 0, subtotal_usd: 0 };
      return `<div><strong class="${tierClass(t)}">${t}</strong>: ${d.count} card(s), $${Number(d.subtotal_usd || 0).toFixed(2)}</div>`;
    }).join('') + `<div><strong>Total estimated:</strong> $${Number(totalUsd || 0).toFixed(2)}</div>`;
  }

  /// Polls every batch a chunked upload created and merges them into one
  /// combined table + summary, so a 495-photo upload (4 real groups behind
  /// the scenes) reads as one job, not four disconnected ones.
  async function pollAllBatches() {
    clearTimeout(pollTimer);
    try {
      await Promise.all(activeBatches.map(async (b) => {
        const res = await fetch(`/api/v1/mtg-cards/batch/${b.batchId}`, { headers: authHeaders() });
        const json = await res.json();
        if (json.ok) {
          b.done = json.done;
          b.total = json.total;
          b.rows = json.rows;
        }
      }));

      const allRows = activeBatches.flatMap((b) => b.rows);
      const totalDone = activeBatches.reduce((s, b) => s + b.done, 0);
      const totalCount = activeBatches.reduce((s, b) => s + b.total, 0);
      renderRows(allRows);
      const groupNote = activeBatches.length > 1 ? ` across ${activeBatches.length} group(s)` : '';
      statusEl.textContent = `${totalDone}/${totalCount} processed${groupNote}`;

      if (totalDone < totalCount) {
        pollTimer = setTimeout(pollAllBatches, 2000);
        return;
      }

      // All groups done -- merge per-group summaries into one real total.
      const summaries = await Promise.all(activeBatches.map(async (b) => {
        const res = await fetch(`/api/v1/mtg-cards/batch/${b.batchId}/summary`, { headers: authHeaders() });
        return res.json();
      }));
      const byTier = {};
      let totalUsd = 0;
      for (const s of summaries) {
        if (!s.ok) continue;
        for (const [tier, d] of Object.entries(s.by_tier || {})) {
          byTier[tier] = byTier[tier] || { count: 0, subtotal_usd: 0 };
          byTier[tier].count += d.count;
          byTier[tier].subtotal_usd += d.subtotal_usd;
        }
        totalUsd += Number(s.total_estimated_usd || 0);
      }
      renderSummary(byTier, totalUsd);
      statusEl.textContent = `Done — ${totalCount} card(s)${groupNote}`;
    } catch (err) {
      statusEl.textContent = `Status check failed: ${err.message}`;
    }
    uploadBtn.disabled = false;
  }
</script>
</body>
</html>
